<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Resume – Devansh Mishra</title>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'Libre Baskerville', serif;
      background-color: #0B1A2D;
      color: #DDD8CC;
      overflow: hidden;
      position: relative;
    }

    .stars {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }

    .stars::after {
      content: '';
      width: 200%;
      height: 200%;
      position: absolute;
      top: -50%;
      left: -50%;
      background: transparent url('https://www.transparenttextures.com/patterns/stardust.png') repeat;
      animation: twinkle 20s linear infinite;
      opacity: 0.15;
    }

    @keyframes twinkle {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .header {
      z-index: 2;
      position: absolute;
      top: 1rem;
      left: 1rem;
    }

    .back-button {
      text-decoration: none;
      color: #DDD8CC;
      border: 1px solid #DDD8CC;
      padding: 0.5rem 1rem;
      border-radius: 24px;
      transition: 0.3s;
      font-size: 0.95rem;
    }

    .back-button:hover {
      background-color: #DDD8CC;
      color: #0B1A2D;
    }

    .resume-embed {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100vh;
      border: none;
    }

    @media (max-width: 600px) {
      .back-button {
        font-size: 0.85rem;
        padding: 0.4rem 0.8rem;
      }
    }
  </style>
</head>
<body>

  <div class="stars"></div>

  <div class="header">
    <a href="index.html" class="back-button">&#8592; Back</a>
  </div>

  <embed src="Resume_Mishra.pdf" type="application/pdf" class="resume-embed" />

</body>
</html>
