<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Resume – Devansh Mishra</title>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Libre Baskerville', serif;
      background-color: #0B1A2D;
      color: #DDD8CC;
      min-height: 100vh;
      overflow: hidden;
      position: relative;
    }

    .stars {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }

    .stars::after {
      content: '';
      width: 200%;
      height: 200%;
      position: absolute;
      top: -50%;
      left: -50%;
      background: transparent url('https://www.transparenttextures.com/patterns/stardust.png') repeat;
      animation: twinkle 20s linear infinite;
      opacity: 0.15;
    }

    @keyframes twinkle {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .content {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem 3rem;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 1rem;
      text-align: center;
    }

    .back-button {
      margin-bottom: 2rem;
      text-decoration: none;
      color: #DDD8CC;
      border: 1px solid #DDD8CC;
      padding: 0.5rem 1rem;
      border-radius: 24px;
      transition: 0.3s;
    }

    .back-button:hover {
      background-color: #DDD8CC;
      color: #0B1A2D;
    }

    .resume-frame {
      width: 90%;
      max-width: 900px;
      height: 85vh;
      border: none;
      border-radius: 12px;
      box-shadow: 0 0 12px rgba(0,0,0,0.4);
    }

    @media (max-width: 600px) {
      .resume-frame {
        height: 75vh;
      }

      h1 {
        font-size: 1.5rem;
      }
    }
  </style>
</head>
<body>

  <div class="stars"></div>

  <div class="content">
    <a href="index.html" class="back-button">&#8592; Back</a>
    <h1>Resume – Devansh Mishra</h1>
    <iframe class="resume-frame" src="Resume_Mishra.pdf"></iframe>
  </div>

</body>
</html>
