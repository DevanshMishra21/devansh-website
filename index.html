<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Devansh Mishra</title>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville&display=swap" rel="stylesheet">
  <style>
    :root {
      --accent: #f8f1dc;
      --bg: #0B1A2D;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      background-color: var(--bg);
      font-family: 'Libre Baskerville', serif;
      color: var(--accent);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
      position: relative;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      z-index: 0;
    }

    .crt {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 2;
      background: repeating-linear-gradient(
        rgba(255,255,255,0.03) 0px,
        rgba(255,255,255,0.03) 1px,
        transparent 1px,
        transparent 2px
      );
      mix-blend-mode: screen;
      animation: crt-flicker 0.15s infinite;
    }

    @keyframes crt-flicker {
      0%, 100% { opacity: 0.97; }
      50% { opacity: 1; }
    }

    .container {
      z-index: 1;
      max-width: 700px;
      position: relative;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 0.75rem;
    }

    h2 {
      font-size: 1.25rem;
      margin-bottom: 1.5rem;
      font-weight: normal;
    }

    p {
      font-size: 1rem;
      margin-bottom: 2rem;
      line-height: 1.6;
    }

    .cta-button {
      background: transparent;
      border: 2px solid var(--accent);
      color: var(--accent);
      padding: 0.75rem 1.75rem;
      font-size: 1rem;
      border-radius: 9999px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s ease;
      text-decoration: none;
      display: inline-block;
      margin-bottom: 2rem;
    }

    .cta-button:hover {
      background-color: var(--accent);
      color: var(--bg);
    }

    .links {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1rem;
    }

    .links a {
      text-decoration: none;
      color: var(--accent);
      border: 1px solid var(--accent);
      padding: 0.5rem 1.25rem;
      border-radius: 9999px;
      font-size: 0.95rem;
      transition: all 0.3s ease;
    }

    .links a:hover {
      background-color: var(--accent);
      color: var(--bg);
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 2rem;
      }

      h2 {
        font-size: 1rem;
      }

      p {
        font-size: 0.9rem;
      }
    }
  </style>
</head>
<body>

  <canvas id="stars"></canvas>

  <div class="container">
    <h1>Devansh Mishra</h1>
    <h2>Engineer. Builder. Strategist.</h2>
    <p>
      I work on ideas that blend creativity, community, and code.<br />
      Currently building DriftChat — a sarcastic wingman that connects you to new people via SMS.
    </p>
    <a class="cta-button" href="mailto:devanshrajmishra@hotmail.com">Get in touch</a>
    <div class="links">
      <a href="https://www.drift-chat.com" target="_blank">DriftChat</a>
      <a href="Resume_Mishra.pdf" download>Resume</a>
      <a href="Portfolio.pdf" download>Portfolio</a>
      <a href="https://www.linkedin.com/in/devanshmishra21" target="_blank">LinkedIn</a>
    </div>
  </div>

  <div class="crt"></div>

  <script>
    const canvas = document.getElementById('stars');
    const ctx = canvas.getContext('2d');

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }

    window.addEventListener('resize', resize);
    resize();

    const stars = Array.from({ length: 200 }, () => ({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      radius: Math.random() * 3 + 1,,
      alpha: Math.random(),
      dx: Math.random() * 0.005 + 0.002,
    }));

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      stars.forEach(star => {
        star.alpha += star.dx;
        if (star.alpha <= 0 || star.alpha >= 1) star.dx *= -1;
        ctx.beginPath();
        ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 255, 255, ${star.alpha})`;
        ctx.fill();
      });
      requestAnimationFrame(draw);
    }

    draw();
  </script>
</body>
</html>
