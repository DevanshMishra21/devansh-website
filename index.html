<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Devansh Mishra</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Press Start 2P', monospace;
      background-color: #0B1A2D;
      color: #DDD8CC;
      overflow: hidden;
      position: relative;
      min-height: 100vh;
    }

    /* ✨ Twinkling Stars (animated dots) */
    .stars {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 0;
      background: #0B1A2D;
    }

    .stars::before {
      content: '';
      position: absolute;
      width: 100%;
      height: 100%;
      background-image: radial-gradient(white 1.5px, transparent 1.5px);
      background-size: 80px 80px;
      animation: twinkle 4s infinite linear;
      opacity: 0.15;
    }

    @keyframes twinkle {
      0% { transform: scale(1) rotate(0deg); opacity: 0.12; }
      50% { transform: scale(1.05) rotate(180deg); opacity: 0.22; }
      100% { transform: scale(1) rotate(360deg); opacity: 0.12; }
    }

    /* 🖥️ CRT Overlay */
    .crt {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 2;
      background: repeating-linear-gradient(
        rgba(255,255,255,0.03) 0px,
        rgba(255,255,255,0.03) 1px,
        transparent 1px,
        transparent 2px
      );
      mix-blend-mode: screen;
      animation: crt-flicker 0.15s infinite;
    }

    @keyframes crt-flicker {
      0%   { opacity: 0.97; }
      50%  { opacity: 1; }
      100% { opacity: 0.97; }
    }

    .content {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      height: 100vh;
      padding: 0 1rem;
    }

    h1 {
      font-size: 1.3rem;
      margin-bottom: 2rem;
      max-width: 800px;
    }

    p {
      font-size: 0.9rem;
      max-width: 600px;
      margin-bottom: 2rem;
      line-height: 2;
    }

    .cta-button {
      background: transparent;
      border: 2px solid #DDD8CC;
      color: #DDD8CC;
      padding: 0.8rem 1.6rem;
      font-size: 0.8rem;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      margin-bottom: 2rem;
    }

    .cta-button:hover {
      background-color: #DDD8CC;
      color: #0B1A2D;
    }

    .arrow {
      margin-left: 8px;
    }

    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      justify-content: center;
      margin-top: 1rem;
    }

    .links a {
      text-decoration: none;
      color: #DDD8CC;
      border: 1px solid #DDD8CC;
      padding: 0.6rem 1.2rem;
      font-size: 0.75rem;
    }

    .links a:hover {
      background-color: #DDD8CC;
      color: #0B1A2D;
    }

    .footer {
      position: absolute;
      bottom: 1rem;
      font-size: 0.6rem;
      width: 100%;
      text-align: center;
      z-index: 1;
      color: #888;
    }

    .footer a {
      color: #AAA;
      text-decoration: underline;
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 1rem;
      }
      p {
        font-size: 0.7rem;
      }
      .cta-button {
        font-size: 0.7rem;
      }
      .links a {
        font-size: 0.6rem;
        padding: 0.5rem 1rem;
      }
    }
  </style>
</head>
<body>

  <div class="stars"></div>

  <div class="content">

    <p>ENGINEER • STRATEGIST • BUILDER<br>
       CURRENTLY BUILDING DRIFTCHAT — A SARCASTIC BOT THAT CONNECTS YOU TO NEW PEOPLE VIA SMS.</p>

    <a class="cta-button" href="mailto:devanshrajmishra@hotmail.com">
      GET IN TOUCH <span class="arrow">&#10142;</span>
    </a>

    <div class="links">
      <a href="https://www.drift-chat.com" target="_blank">DRIFTCHAT</a>
      <a href="Resume_Mishra.pdf" download>RESUME</a>
      <a href="Portfolio.pdf" download>PORTFOLIO</a>
      <a href="https://www.linkedin.com/in/devanshmishra21" target="_blank">LINKEDIN</a>
    </div>
  </div>


  <div class="crt"></div>

</body>
</html>
