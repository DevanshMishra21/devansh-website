<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Devansh Mishra</title>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Libre Baskerville', serif;
      background-color: #18332c; /* Drift dark green */
      color: #DDD8CC;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      height: 100vh;
      padding: 0 1rem;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 1rem;
      max-width: 800px;
    }

    p {
      font-size: 1.1rem;
      max-width: 500px;
      margin-bottom: 2.5rem;
    }

    .cta-button {
      background: transparent;
      border: 2px solid #DDD8CC;
      color: #DDD8CC;
      padding: 0.75rem 1.5rem;
      font-size: 1rem;
      border-radius: 32px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s ease;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .cta-button:hover {
      background-color: #DDD8CC;
      color: #18332c;
    }

    .arrow {
      margin-left: 10px;
      font-size: 1.2rem;
    }

    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      justify-content: center;
      margin-top: 2rem;
    }

    .links a {
      text-decoration: none;
      color: #DDD8CC;
      border: 1px solid #DDD8CC;
      padding: 0.5rem 1.2rem;
      border-radius: 24px;
      font-size: 0.95rem;
      transition: all 0.3s ease;
    }

    .links a:hover {
      background-color: #DDD8CC;
      color: #18332c;
    }

    .footer {
      position: absolute;
      bottom: 1rem;
      font-size: 0.9rem;
    }

    .footer a {
      color: #AAA;
      text-decoration: underline;
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 2rem;
      }
      p {
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>

  <h1>Hi, I'm Devansh Mishra.</h1>
  <p>I build things at the intersection of strategy, engineering, and product design.<br />Currently working on DriftChat and Halftime.</p>

  <a class="cta-button" href="mailto:devansh@example.com">
    Get in touch <span class="arrow">&#10142;</span>
  </a>

  <div class="links">
    <a href="#">DriftApp</a>
    <a href="#">Halftime</a>
    <a href="#">Resume</a>
    <a href="#">GitHub</a>
  </div>

  <div class="footer">
    <a href="#">Terms & Conditions</a>
  </div>

</body>
</html>
