<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Devansh Mishra</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Press Start 2P', monospace;
      background-color: #0B1A2D;
      color: #DDD8CC;
      overflow: hidden;
      position: relative;
      min-height: 100vh;
    }

    /* 🔭 Bigger, pixel-style stars */
    .stars {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 0;
      background: radial-gradient(#fff 2px, transparent 2px),
                  radial-gradient(#fff 2px, transparent 2px);
      background-size: 120px 120px;
      background-position: 0 0, 60px 60px;
      opacity: 0.12;
      animation: twinkle 30s linear infinite;
    }

    @keyframes twinkle {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* 🖥️ CRT Overlay */
    .crt {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      pointer-events: none;
      background: repeating-linear-gradient(
        rgba(255, 255, 255, 0.03) 0px,
        rgba(255, 255, 255, 0.03) 1px,
        transparent 1px,
        transparent 2px
      );
      animation: flicker 1s infinite;
      mix-blend-mode: screen;
    }

    @keyframes flicker {
      0%, 100% { opacity: 0.96; }
      50% { opacity: 1; }
    }

    .content {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      height: 100vh;
      padding: 0 1rem;
    }

    h1 {
      font-size: 1.1rem;
      margin-bottom: 1.5rem;
      max-width: 800px;
    }

    p {
      font-size: 0.65rem;
      max-width: 600px;
      margin-bottom: 2rem;
      line-height: 1.7;
    }

    .cta-button {
      background: transparent;
      border: 2px solid #DDD8CC;
      color: #DDD8CC;
      padding: 0.6rem 1.2rem;
      font-size: 0.65rem;
      border-radius: 0;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      margin-bottom: 1.5rem;
    }

    .cta-button:hover {
      background-color: #DDD8CC;
      color: #0B1A2D;
    }

    .arrow {
      margin-left: 6px;
    }

    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      justify-content: center;
      margin-top: 1.5rem;
    }

    .links a {
      text-decoration: none;
      color: #DDD8CC;
      border: 1px solid #DDD8CC;
      padding: 0.5rem 1rem;
      font-size: 0.6rem;
    }

    .links a:hover {
      background-color: #DDD8CC;
      color: #0B1A2D;
    }

    .footer {
      position: absolute;
      bottom: 1rem;
      font-size: 0.5rem;
      width: 100%;
      text-align: center;
      z-index: 1;
      color: #888;
    }

    .footer a {
      color: #AAA;
      text-decoration: underline;
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 0.95rem;
      }
      p {
        font-size: 0.55rem;
      }
      .links a {
        font-size: 0.5rem;
        padding: 0.4rem 0.8rem;
      }
    }
  </style>
</head>
<body>

  <div class="stars"></div>

  <div class="content">
    <h1>HI, I'M DEVANSH MISHRA.</h1>
    <p>ENGINEER • STRATEGIST • BUILDER<br>
    CURRENTLY BUILDING DRIFTCHAT — A SARCASTIC WINGMAN THAT CONNECTS YOU TO NEW PEOPLE VIA SMS</p>

    <a class="cta-button" href="mailto:devanshrajmishra@hotmail.com">
      GET IN TOUCH <span class="arrow">&#10142;</span>
    </a>

    <div class="links">
      <a href="https://www.drift-chat.com" target="_blank">DRIFTCHAT</a>
      <a href="Resume_Mishra.pdf" download>RESUME</a>
      <a href="Portfolio.pdf" download>PORTFOLIO</a>
      <a href="https://www.linkedin.com/in/devanshmishra21" target="_blank">LINKEDIN</a>
    </div>
  </div>

  <div class="footer">
    <a href="#">TERMS & CONDITIONS</a>
  </div>

  <div class="crt"></div>

</body>
</html>
