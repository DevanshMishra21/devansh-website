<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Devansh Mishra</title>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Libre Baskerville', serif;
      background-color: #0B1A2D;
      color: #DDD8CC;
      overflow: hidden;
      position: relative;
      min-height: 100vh;
    }

    /* ✨ Bigger Twinkling Stars */
    .stars {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 0;
      background: radial-gradient(white 1px, transparent 1px),
                  radial-gradient(white 1px, transparent 1px);
      background-size: 100px 100px;
      background-position: 0 0, 50px 50px;
      opacity: 0.1;
      animation: twinkle 30s linear infinite;
    }

    @keyframes twinkle {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .content {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      height: 100vh;
      padding: 0 1rem;
    }

    h1 {
      font-size: 2.75rem;
      margin-bottom: 1rem;
      max-width: 800px;
      color: #f8f8f8;
      text-shadow: 0 0 6px #b477ff, 0 0 12px #b477ff;
    }

    p {
      font-size: 1.2rem;
      max-width: 600px;
      margin-bottom: 2.5rem;
      line-height: 1.7;
      color: #d8d8f2;
      text-shadow: 0 0 3px rgba(180, 180, 255, 0.1);
    }

    .cta-button {
      background: transparent;
      border: 2px solid #DDD8CC;
      color: #DDD8CC;
      padding: 0.75rem 1.5rem;
      font-size: 1rem;
      border-radius: 32px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s ease;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 8px rgba(255, 255, 255, 0.2);
    }

    .cta-button:hover {
      background-color: #DDD8CC;
      color: #0B1A2D;
    }

    .arrow {
      margin-left: 10px;
      font-size: 1.2rem;
    }

    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      justify-content: center;
      margin-top: 2.5rem;
    }

    .links a {
      text-decoration: none;
      color: #DDD8CC;
      border: 1px solid #DDD8CC;
      padding: 0.6rem 1.4rem;
      border-radius: 24px;
      font-size: 0.95rem;
      transition: all 0.3s ease;
      background: rgba(255, 255, 255, 0.02);
      box-shadow: 0 0 4px rgba(180, 119, 255, 0.2);
    }

    .links a:hover {
      background-color: #DDD8CC;
      color: #0B1A2D;
    }

    .footer {
      position: absolute;
      bottom: 1rem;
      font-size: 0.85rem;
      width: 100%;
      text-align: center;
      z-index: 1;
      color: #888;
    }

    .footer a {
      color: #AAA;
      text-decoration: underline;
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 2.1rem;
      }
      p {
        font-size: 1rem;
      }
      .links a {
        font-size: 0.9rem;
        padding: 0.5rem 1.2rem;
      }
    }
  </style>
</head>
<body>

  <div class="stars"></div>

  <div class="content">
    <h1>Hi, I'm Devansh Mishra.</h1>
    <p>Engineer. Builder. Strategist. <br> I work on ideas that blend creativity, community, and code. Currently building DriftChat — a sarcastic wingman that connects you to new people via SMS.</p>

    <a class="cta-button" href="mailto:devanshrajmishra@hotmail.com">
      Get in touch <span class="arrow">&#10142;</span>
    </a>

    <div class="links">
      <a href="https://www.drift-chat.com" target="_blank">DriftChat</a>
      <a href="Resume_Mishra.pdf" download>Resume</a>
      <a href="Portfolio.pdf" download>Portfolio</a>
      <a href="https://www.linkedin.com/in/devanshmishra21" target="_blank">LinkedIn</a>
    </div>
  </div>
</body>
</html>
