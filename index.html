<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Devansh Mishra</title>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Libre Baskerville', serif;
      background-color: #0B1A2D; /* Navy Blue */
      color: #DDD8CC;
      overflow: hidden;
      position: relative;
      min-height: 100vh;
    }

    /* Twinkling Stars Background */
    .stars {
      width: 100%;
      height: 100%;
      background: transparent;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 0;
    }

    .stars::after {
      content: '';
      width: 200%;
      height: 200%;
      position: absolute;
      top: -50%;
      left: -50%;
      background: transparent url('https://www.transparenttextures.com/patterns/stardust.png') repeat;
      animation: twinkle 20s linear infinite;
      opacity: 0.15;
    }

    @keyframes twinkle {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .content {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      height: 100vh;
      padding: 0 1rem;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 1rem;
      max-width: 800px;
    }

    p {
      font-size: 1.1rem;
      max-width: 550px;
      margin-bottom: 2.5rem;
      line-height: 1.6;
    }

    .cta-button {
      background: transparent;
      border: 2px solid #DDD8CC;
      color: #DDD8CC;
      padding: 0.75rem 1.5rem;
      font-size: 1rem;
      border-radius: 32px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s ease;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .cta-button:hover {
      background-color: #DDD8CC;
      color: #0B1A2D;
    }

    .arrow {
      margin-left: 10px;
      font-size: 1.2rem;
    }

    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      justify-content: center;
      margin-top: 2.5rem;
    }

    .links a {
      text-decoration: none;
      color: #DDD8CC;
      border: 1px solid #DDD8CC;
      padding: 0.6rem 1.4rem;
      border-radius: 24px;
      font-size: 0.95rem;
      transition: all 0.3s ease;
    }

    .links a:hover {
      background-color: #DDD8CC;
      color: #0B1A2D;
    }

    .footer {
      position: absolute;
      bottom: 1rem;
      font-size: 0.9rem;
      width: 100%;
      text-align: center;
      z-index: 1;
    }

    .footer a {
      color: #AAA;
      text-decoration: underline;
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 2rem;
      }
      p {
        font-size: 1rem;
      }
      .links a {
        font-size: 0.9rem;
        padding: 0.5rem 1.2rem;
      }
    }
  </style>
</head>
<body>

  <div class="stars"></div>

  <div class="content">
    <h1>Hi, I'm Devansh Mishra.</h1>
    <p>Engineer. Builder. Strategist. <br> I work on ideas that blend creativity, community, and code. Currently building DriftChat.</p>

    <a class="cta-button" href="mailto:devansh@example.com">
      Get in touch <span class="arrow">&#10142;</span>
    </a>

    <div class="links">
      <a href="#">DriftChat</a>
      <a href="/resume.pdf" download>Resume</a>
      <a href="#">Portfolio</a>
      <a href="https://www.linkedin.com/in/devanshmishra" target="_blank">LinkedIn</a>
    </div>
  </div>

  <div class="footer">
    <a href="#">Terms & Conditions</a>
  </div>

</body>
</html>
